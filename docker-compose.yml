version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: kisan_ai_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: thuli_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: kisan_ai_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./Exotel:/app/Exotel
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/thuli_ai
      - PORT=8000
      # You can add API Keys below, or map an env_file
      # - SARVAM_API_KEY=your_key_here
      # - GROQ_API_KEY=your_key_here
    env_file:
      - ./backend/.env
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kisan_ai_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  admin_portal:
    build:
      context: ./admin_portal
      dockerfile: Dockerfile
    container_name: kisan_ai_admin
    ports:
      - "5174:5174"
    volumes:
      - ./admin_portal:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:

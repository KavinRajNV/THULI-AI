# =============================================================================
# Thuli AI — Local Docker Testing Compose File
# For local testing on Windows (Docker Desktop with Linux containers)
# =============================================================================
version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: thuli_ai_local_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: thuli_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thuli_ai"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: thuli_ai_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/thuli_ai
      - DATABASE_URL_SYNC=postgresql://postgres:password@db:5432/thuli_ai
      - PORT=8000
      - BASE_URL=http://localhost:8000
      - S3_BUCKET=
      - S3_UPLOAD_AUDIO=false
      - INTENT_BACKEND=rules
    env_file:
      - ./backend/.env
    volumes:
      # Optional bind-mounts for live local development & test
      - ./backend:/app/backend
      - ./Exotel:/app/Exotel
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_local_data:
